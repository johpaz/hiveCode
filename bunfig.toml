# Hive configuration for Bun runtime

[install]
production = false

[run]
hot = true

[test]
coverage = false
timeout = 30000
smol = true
# Real API integration tests require explicit invocation (use --tsconfig-override tests/tsconfig.json)
# Excluded here so agent worktrees don't auto-discover and run them without proper module resolution
# `bench/tasks/tareas/` is the fixture of another benchmark task: it expects a server project
# (`src/server.ts`) that this repo does not have. The `inventario` fixture does run here and
# checks the CLI in `src/`.
# `pathIgnorePatterns` is the key Bun reads for this (`exclude` was ignored by the runner).
pathIgnorePatterns = ["tests/agents/*.real.test.ts", "bench/tasks/tareas/**"]
