name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un tag sólo se publica si está en main: evita liberar una rama a medias.
      - name: El tag pertenece a main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::el tag ${GITHUB_REF_NAME} no está en main"; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hivetui

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Tests Bun
        run: bun run test --parallel
      - name: Tests Rust (TUI)
        run: cargo test --locked --manifest-path packages/hivetui/Cargo.toml

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            rust: x86_64-unknown-linux-gnu
            artifact: hive-code-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            rust: aarch64-unknown-linux-gnu
            artifact: hive-code-linux-arm64
          - os: ubuntu-latest
            target: bun-linux-x64-musl
            rust: x86_64-unknown-linux-musl
            artifact: hive-code-linux-x64-musl
          - os: macos-latest
            target: bun-darwin-x64
            rust: x86_64-apple-darwin
            artifact: hive-code-macos-x64
          - os: macos-latest
            target: bun-darwin-arm64
            rust: aarch64-apple-darwin
            artifact: hive-code-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            rust: x86_64-pc-windows-msvc
            artifact: hive-code-windows-x64.exe
          - os: windows-latest
            target: bun-windows-x64-arm64
            rust: aarch64-pc-windows-msvc
            artifact: hive-code-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hivetui
          key: ${{ matrix.rust }}

      - name: Install musl tools
        if: contains(matrix.rust, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # La TUI va embebida en el binario vía packages/hivetui/hivetui.bin. Si
      # falla, el build falla: un release sin TUI no arranca.
      - name: Build TUI
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.rust }} \
            --manifest-path packages/hivetui/Cargo.toml
          BIN=packages/hivetui/target/${{ matrix.rust }}/release/hivetui
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          cp "$BIN" packages/hivetui/hivetui.bin
          ls -la packages/hivetui/hivetui.bin

      - name: Build CLI binary
        run: |
          bun build packages/cli/src/index.ts \
            --compile \
            --bytecode \
            --target ${{ matrix.target }} \
            --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd packages/cli
          npm version $VERSION --no-git-tag-version

      - name: Publish to npm
        run: cd packages/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
