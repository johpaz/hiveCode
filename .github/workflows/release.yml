name: Release

# Un tag vX.Y.Z publica un binario único `hivecode` (con la TUI incrustada) por plataforma.
# La TUI usa un socket Unix, así que no hay build de Windows.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    artifact: hivecode-linux-x64 }
          - { os: ubuntu-24.04-arm, artifact: hivecode-linux-arm64 }
          - { os: macos-14,         artifact: hivecode-macos-arm64 }
          - { os: macos-13,         artifact: hivecode-macos-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: hiveCode
      - uses: actions/checkout@v4
        with:
          repository: johpaz/hiveSDK-Rust
          path: hiveRust/hiveSDK-Rust
          token: ${{ secrets.SDK_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hiveCode
            hiveCode/packages/hivetui
      - name: Pruebas
        working-directory: hiveCode
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          cargo build --locked --manifest-path packages/hivetui/Cargo.toml
          cargo test --workspace --locked
      - name: Binario
        working-directory: hiveCode
        run: |
          scripts/build-rust.sh
          cp dist/hivecode-rust-* "dist/${{ matrix.artifact }}"
          (cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256" 2>/dev/null || shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
      - name: Arranca sin dependencias
        working-directory: hiveCode
        run: |
          H=$(mktemp -d)
          HIVE_HOME="$H" "dist/${{ matrix.artifact }}" --version
          HIVE_HOME="$H" HIVECODE_API_KEY=x HIVECODE_MODEL=x "dist/${{ matrix.artifact }}" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            hiveCode/dist/${{ matrix.artifact }}
            hiveCode/dist/${{ matrix.artifact }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Sumas
        run: cd artifacts && cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
