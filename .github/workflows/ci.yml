name: CI

# release.yml sólo dispara con tags y nunca corrió la suite: los 22 archivos de
# test del repo no los verificaba nada antes de publicar.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin exacto: Bun 1.4.1 traía dos regresiones (renombrado de `var` en
          # `bun build`, que rompía imports con SyntaxError, y una fuga de
          # AsyncLocalStorage) que sólo 1.4.2 y posteriores corrigen; se fija 1.4.4, la que se usa en local.
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile

      # Los E2E de la TUI ejecutan packages/hivetui/target/debug/hivetui.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hivetui
      - name: Build TUI (debug)
        run: cargo build --locked --manifest-path packages/hivetui/Cargo.toml

      - name: Typecheck
        run: bun run lint

      # --parallel reparte los archivos entre procesos (uno por núcleo) e implica
      # --isolate. Medido en este repo: 23,6 s -> 18,1 s, con resultados idénticos.
      # `bun run test` lleva el --preload que aísla la DB; sin él los tests
      # tocarían la base real.
      - name: Tests
        run: bun run test --parallel

  tui:
    name: TUI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/hivetui
      - name: Tests
        run: cargo test --locked --manifest-path packages/hivetui/Cargo.toml

      # El release compila la TUI para Windows; `cargo check` no necesita linker,
      # así que un `tokio::signal::unix` suelto falla aquí y no al publicar.
      - name: Compila para Windows (x64 y arm64)
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          for t in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            cargo check --locked --release --bins --lib --target "$t" \
              --manifest-path packages/hivetui/Cargo.toml
          done
