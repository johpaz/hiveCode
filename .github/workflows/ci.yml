name: CI

# hivecode depende del SDK por ruta relativa (`../hiveRust/hiveSDK-Rust`): se descargan los dos
# repositorios con esa misma disposición. Si el SDK es privado, hace falta el secreto SDK_TOKEN
# (un token con permiso de lectura sobre johpaz/hiveSDK-Rust).
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, clippy y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hiveCode
      - uses: actions/checkout@v4
        with:
          repository: johpaz/hiveSDK-Rust
          path: hiveRust/hiveSDK-Rust
          token: ${{ secrets.SDK_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hiveCode
            hiveCode/packages/hivetui
      - name: git para las pruebas (worktrees)
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Formato
        working-directory: hiveCode
        run: cargo fmt --check
      - name: Clippy
        working-directory: hiveCode
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # La TUI se compila antes: una prueba del CLI la ejecuta si existe.
      - name: TUI (debug)
        working-directory: hiveCode
        run: cargo build --locked --manifest-path packages/hivetui/Cargo.toml
      - name: Pruebas del workspace
        working-directory: hiveCode
        run: cargo test --workspace --locked
      - name: Pruebas de la TUI
        working-directory: hiveCode
        run: cargo test --locked --manifest-path packages/hivetui/Cargo.toml
