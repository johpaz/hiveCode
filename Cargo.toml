[workspace]
resolver = "3"
members = ["crates/hivecode-host", "crates/hivecode-app"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# The Hive Agents SDK engine. Path dependency while both trees live side by side.
hive-agent-core = { path = "../hiveRust/hiveSDK-Rust/crates/hive-core", features = ["services", "harness", "scheduler", "tools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
strip = "symbols"
